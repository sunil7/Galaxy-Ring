name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME).
      # android-actions/setup-android@v3 was failing here ("Failed to find package 'tools'"),
      # so it is replaced by a plain license acceptance so Gradle can fetch any missing packages.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Prepare Secrets file
        run: |
          touch .env
          touch .env.example
          echo "# Generated in CI" >> .env

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-ring-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
